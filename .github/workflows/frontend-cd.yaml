name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.14.2
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.14.2
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run tests
        working-directory: starter/frontend
        run: CI=true npm test -- --watchAll=false

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.14.2
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name cluster

      - name: Resolve backend API URL for build-arg
        id: backend_url
        run: |
          set -euo pipefail
          SECRET_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}"
          BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -z "$BACKEND_HOST" ]; then
            BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          fi
          if [ -n "${SECRET_URL}" ]; then
            API_URL="$SECRET_URL"
          elif [ -n "$BACKEND_HOST" ]; then
            API_URL="http://${BACKEND_HOST}"
          else
            echo "ERROR: Backend LoadBalancer not found."
            echo "Run Backend CD successfully first, or set optional secret REACT_APP_MOVIE_API_URL."
            kubectl get svc backend -o wide || true
            exit 1
          fi
          echo "Using REACT_APP_MOVIE_API_URL=${API_URL}"
          echo "url=${API_URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        working-directory: starter/frontend
        env:
          REACT_APP_MOVIE_API_URL: ${{ steps.backend_url.outputs.url }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            --tag $ECR_REGISTRY/frontend:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/frontend:$IMAGE_TAG

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name cluster

      - name: Ensure EKS worker nodes are Ready
        run: |
          chmod +x scripts/ensure-eks-nodes.sh
          bash scripts/ensure-eks-nodes.sh

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Apply Kubernetes manifests
        run: |
          cd starter/frontend/k8s
          kustomize edit set image frontend=$ECR_REGISTRY/frontend:$IMAGE_TAG
          kustomize build | kubectl apply -f -

      - name: Wait for rollout and publish LoadBalancer URL
        run: |
          set -euo pipefail
          echo "== nodes =="
          kubectl get nodes -o wide

          kubectl delete pods -l app=frontend --force --grace-period=0 2>/dev/null || true
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/frontend --timeout=600s

          echo "Waiting for frontend LoadBalancer hostname..."
          FRONTEND_HOST=""
          for _ in $(seq 1 72); do
            FRONTEND_HOST=$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$FRONTEND_HOST" ]; then
              FRONTEND_HOST=$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$FRONTEND_HOST" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$FRONTEND_HOST" ]; then
            echo "ERROR: frontend LoadBalancer address was not assigned"
            kubectl get svc frontend -o wide || true
            kubectl describe svc frontend || true
            kubectl get pods -l app=frontend -o wide || true
            exit 1
          fi
          FRONTEND_URL="http://${FRONTEND_HOST}"
          BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -z "$BACKEND_HOST" ]; then
            BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          fi
          BACKEND_URL="http://${BACKEND_HOST}"
          echo "FRONTEND_URL=${FRONTEND_URL}" >> "$GITHUB_ENV"
          echo "BACKEND_URL=${BACKEND_URL}" >> "$GITHUB_ENV"
          echo "::notice title=Frontend LoadBalancer URL::${FRONTEND_URL}"
          echo "::notice title=Backend LoadBalancer URL::${BACKEND_URL}"
          echo "::notice title=Backend movies API::${BACKEND_URL}/movies"
          {
            echo "## Microservice access proof"
            echo ""
            echo "- Frontend LoadBalancer: \`${FRONTEND_URL}\`"
            echo "- Backend LoadBalancer: \`${BACKEND_URL}\`"
            echo "- Backend movies API: \`${BACKEND_URL}/movies\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend URL: ${FRONTEND_URL}"
          echo "Backend URL: ${BACKEND_URL}"
          kubectl get svc frontend backend -o wide
          kubectl get pods -l 'app in (frontend,backend)' -o wide

      - name: Verify frontend and backend URLs
        run: |
          set -euo pipefail
          echo "Curling frontend ${FRONTEND_URL}"
          curl -sfI "${FRONTEND_URL}" | head -n 20
          echo "Curling backend ${BACKEND_URL}/movies"
          curl -sf "${BACKEND_URL}/movies"
          echo
          echo "Both services are reachable via LoadBalancer DNS"
          echo "::notice title=Public Frontend URL::${FRONTEND_URL}"
          echo "::notice title=Public Backend URL::${BACKEND_URL}"
