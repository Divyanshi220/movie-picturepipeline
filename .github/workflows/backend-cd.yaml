name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          pip install pipenv
          pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          pip install pipenv
          pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: starter/backend
        run: |
          docker build --tag $ECR_REGISTRY/backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/backend:$IMAGE_TAG

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name cluster

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Apply Kubernetes manifests
        run: |
          cd starter/backend/k8s
          kustomize edit set image backend=$ECR_REGISTRY/backend:$IMAGE_TAG
          kustomize build | kubectl apply -f -

      - name: Wait for rollout and publish LoadBalancer URL
        run: |
          set -euo pipefail
          dump_diag() {
            {
              echo "## Backend deploy diagnostics"
              echo '```'
              kubectl get nodes -o wide || true
              kubectl get svc backend -o wide || true
              kubectl get pods -l app=backend -o wide || true
              kubectl describe deployment backend | tail -n 80 || true
              kubectl describe pods -l app=backend | tail -n 120 || true
              kubectl logs -l app=backend --tail=80 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap dump_diag ERR

          echo "== nodes =="
          kubectl get nodes -o wide
          NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c . || true)
          if [ "${NODE_COUNT}" = "0" ]; then
            echo "ERROR: EKS has no worker nodes. In your AWS lab session, recreate the node group, then re-run Backend CD."
            dump_diag
            exit 1
          fi

          kubectl delete pods -l app=backend --force --grace-period=0 2>/dev/null || true
          kubectl rollout restart deployment/backend
          if ! kubectl rollout status deployment/backend --timeout=600s; then
            echo "ERROR: backend rollout did not become Ready"
            dump_diag
            exit 1
          fi

          echo "Waiting for backend LoadBalancer hostname..."
          BACKEND_HOST=""
          for _ in $(seq 1 72); do
            BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$BACKEND_HOST" ]; then
              BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$BACKEND_HOST" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$BACKEND_HOST" ]; then
            echo "ERROR: backend LoadBalancer address was not assigned"
            dump_diag
            exit 1
          fi
          BACKEND_URL="http://${BACKEND_HOST}"
          echo "BACKEND_URL=${BACKEND_URL}" >> "$GITHUB_ENV"
          {
            echo "## Backend service URL"
            echo ""
            echo "- LoadBalancer: \`${BACKEND_URL}\`"
            echo "- Movies API: \`${BACKEND_URL}/movies\`"
            echo ""
            echo "No GitHub secret needed for Frontend CD — it discovers this backend URL from the cluster."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Backend URL: ${BACKEND_URL}"
          kubectl get svc backend -o wide
          kubectl get pods -l app=backend -o wide

      - name: Verify backend API
        run: |
          set -euo pipefail
          echo "Curling ${BACKEND_URL}/movies"
          for _ in $(seq 1 36); do
            if curl -sf "${BACKEND_URL}/movies"; then
              echo
              echo "Backend API is reachable"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: backend API did not respond"
          kubectl describe pods -l app=backend | tail -n 80
          exit 1
